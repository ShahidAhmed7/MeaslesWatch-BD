version = "completion-v1"
approved_scope = "User authorized specification-based build and lightweight RAG, 26 October 2026"
primary_protocol = ".devin/analysis_protocol.toml"
benchmark_protocol = "benchmark/frozen/external-v1/protocol.toml"
primary_test_seed = 2026
optional_test_seeds = [2027, 2028]
run_multiplicity_amendment = "Complete all 30 questions with one paired seed first; extra seeds only if conservative runtime and budget allow. Frozen questions, gold, source coverage and Qwen settings remain unchanged."
training_window_sensitivities = [36, 84]
seasonal_reference = "Same calendar-month mean over prior 60 months; explicit Poisson-reference intervals and threshold, not an assumption of empirical calibration"
missingness_sensitivity = "Drop 3 training observations in isolated copy; reject incomplete window rather than impute"
outlier_sensitivity = "Double largest training count in isolated pre-test training window and compare first test origin; never modify primary counts"
retrieval = "Country/date/measure structured filtering plus TF-IDF keyword ranking of source passages; calculations remain deterministic"
external_retrieval_evaluation = "Full registered source coverage is held equal for A and B. Retrieval quality tested separately from the frozen A/B/C contrast."
causal_claim_metric = "unsupported explicit causal relation claims / all emitted claims; free prose separately reviewed"
verifier_error_detection_rate = "detected erroneous seeded claims / erroneous seeded claims"
verifier_false_rejection_rate = "rejected supported seeded claims / supported seeded claims"
benchmark_runtime_gold_access = false
automatic_dashboard_inference = false
