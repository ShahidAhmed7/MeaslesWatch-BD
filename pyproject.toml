[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "measleswatch"
version = "0.1.0"
description = "Reproducible retrospective Bangladesh measles surveillance analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.5,<2",
    "plotly>=5.24,<7",
    "streamlit>=1.39,<2",
    "modal>=1.5,<2",
    "matplotlib>=3.9,<4",
]

[project.scripts]
measleswatch = "measleswatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/measleswatch"]

# Exclude releases published after 2026-10-19 (per handoff: 7 days before
# system date). The timestamp boundary includes all of that date.
[tool.uv]
exclude-newer = "2026-10-20T00:00:00Z"
